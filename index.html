<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#151619"><link rel="manifest" href="./manifest.webmanifest"><title>Gridx</title><style>
:root{color-scheme:dark;--bg:#111214;--panel:#202226;--line:#444952;--text:#f3f4f6;--muted:#a4a9b3;--accent:#a9c7ef}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}button{border:1px solid var(--line);border-radius:13px;background:#292c32;color:var(--text);padding:11px 14px}button:disabled{opacity:.4}.primary{background:#e7edf7;color:#151619;font-weight:700;border:0;border-radius:13px;padding:11px 14px;display:inline-flex;cursor:pointer}header,main{max-width:1000px;margin:auto}header{padding:22px 18px 10px;display:flex;justify-content:space-between;align-items:center;gap:10px}.brand{font-size:30px;font-weight:750}.note{font-size:12px;color:var(--muted);line-height:1.6}main{padding:10px 16px 40px}.toolbar,.controls{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.toolbar{margin:12px 0}.spacer{flex:1}.panel{background:var(--panel);border:1px solid #343840;border-radius:18px;padding:14px;margin:12px 0}.stage-wrap{display:flex;justify-content:center;min-height:120px}.stage{position:relative;display:inline-block;max-width:100%;max-height:58vh;line-height:0;user-select:none}.stage>img{display:block;max-width:100%;max-height:58vh;width:auto;height:auto;border-radius:7px}.dim{position:absolute;inset:0;background:rgba(12,14,18,.7);pointer-events:none}.active{position:absolute;overflow:hidden;pointer-events:none;box-shadow:0 0 0 2px var(--accent)}.active img{position:absolute;max-width:none;max-height:none;border-radius:0}.lines{position:absolute;inset:0}.v,.h{position:absolute;background:rgba(235,240,248,.42);box-shadow:0 0 1px rgba(0,0,0,.35);touch-action:none}.v{top:0;bottom:0;width:1px;transform:translateX(-.5px)}.h{left:0;right:0;height:1px;transform:translateY(-.5px)}.v:after{content:"";position:absolute;left:-14px;right:-14px;top:0;bottom:0}.h:after{content:"";position:absolute;top:-14px;bottom:-14px;left:0;right:0}.hit{position:absolute;background:transparent}.field{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}.field input{width:58px;background:#111317;border:1px solid var(--line);border-radius:9px;color:white;padding:8px;text-align:center}.progress{height:7px;background:#454951;border-radius:9px;overflow:hidden;flex:1}.progress div{height:100%;background:var(--accent);width:0}.dim-choice[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}.gallery{display:flex;gap:9px;overflow-x:auto;padding:10px 1px 2px}.thumb{flex:0 0 76px;width:76px;height:76px;object-fit:cover;border-radius:10px;border:2px solid transparent;opacity:.72;cursor:pointer}.thumb.selected{border-color:var(--accent);opacity:1}.hidden{display:none!important}@media(max-width:600px){header{padding-top:calc(14px + env(safe-area-inset-top))}main{padding:8px 12px 30px}.stage,.stage>img{max-height:52vh}.panel{padding:11px}}
</style></head><body><header><div><div class="brand">Gridx</div><div class="note">FOCUSED DRAWING PRACTICE</div></div><div class="note">一マスに集中し、全体を見失わない。</div></header><main>
<div class="toolbar"><label class="primary">写真を選ぶ<input id="file" type="file" accept="image/*" multiple hidden></label><label class="primary">フォルダーを選ぶ<input id="folder" type="file" accept="image/*" webkitdirectory directory multiple hidden></label><button id="reset" disabled>選択を解除</button><span class="spacer"></span><span class="note">写真はブラウザ内で処理します</span></div>
<section id="empty" class="panel" style="text-align:center;padding:38px 16px"><b>模写する写真を選んでください</b><p class="note">複数の写真やフォルダーを読み込めます。読み込んだ写真はギャラリーに並びます。</p></section><section id="galleryPanel" class="panel hidden"><div class="controls"><b>ギャラリー</b><span id="galleryCount" class="note"></span><span class="spacer"></span><button id="shuffle">ランダムに選ぶ</button></div><div id="gallery" class="gallery"></div></section>
<section id="work" class="hidden"><div class="panel"><div class="stage-wrap"><div id="stage" class="stage"><img id="photo"><div id="dim" class="dim"></div><div id="active" class="active"><img id="activePhoto"></div><div id="hits"></div><div id="lines" class="lines"></div></div></div><div class="controls" style="margin-top:13px"><span id="cellLabel" class="note">区画 1-1</span><div class="progress"><div id="bar"></div></div><span id="prog" class="note">0 / 16 完了</span></div></div>
<div class="panel"><div class="controls"><b>格子設定</b><label class="field">横（列）<input id="cols" type="number" min="1" max="12" value="4"></label><label class="field">縦（行）<input id="rows" type="number" min="1" max="12" value="4"></label><button id="apply">均等に再配置</button></div><p class="note">グリッドの線はドラッグして動かせます。通常は1マス、複数選択モードでは複数のマスを選べます。</p><div class="controls"><button id="multiMode" aria-pressed="false">複数選択：OFF</button><span id="selectionInfo" class="note">選択中：1マス</span></div><div class="controls"><button data-n="3">3×3</button><button data-n="4">4×4</button><button data-n="5">5×5</button><button data-n="6">6×6</button><button data-n="8">8×8</button><span class="spacer"></span><span class="note">周囲の表示：</span><button class="dim-choice" data-dim="10">10%</button><button class="dim-choice" data-dim="20" aria-pressed="true">20%</button><button class="dim-choice" data-dim="30">30%</button></div></div>
<div class="panel"><div class="controls"><button id="prev">← 前へ</button><button id="done" class="primary">✓ このマスを完了</button><button id="next">次へ →</button><span class="spacer"></span><button id="clear">進捗をリセット</button></div><p class="note">好きなマスを選び、描き終えたら完了を記録します。</p></div></section></main>
<footer class="note" style="text-align:center;padding:20px">写真は外部サーバーへ送信されません。ページを閉じると再読み込みが必要です。</footer>
<script src="./app.js" defer></script></body></html>
