<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#151619"><link rel="manifest" href="./manifest.webmanifest">
<title>Gridx</title>
<style>
:root{color-scheme:dark;--bg:#111214;--panel:#202226;--line:#383d46;--text:#f3f4f6;--muted:#a4a9b3;--accent:#a9c7ef}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input{font:inherit}button{border:1px solid var(--line);border-radius:12px;background:#292c32;color:var(--text);padding:10px 13px;cursor:pointer}button:disabled{opacity:.4}
.primary{background:#e7edf7;color:#151619;font-weight:700;border:0;border-radius:12px;padding:11px 15px;display:inline-flex;align-items:center;cursor:pointer}
header,main{max-width:1000px;margin:auto}header{padding:22px 18px 10px;display:flex;justify-content:space-between;align-items:center;gap:10px}.brand{font-size:30px;font-weight:750;letter-spacing:-1px}.note{font-size:12px;color:var(--muted);line-height:1.6}
main{padding:10px 16px 40px}.hidden{display:none!important}.panel{background:var(--panel);border:1px solid #343840;border-radius:18px;padding:15px;margin:12px 0}
.toolbar,.controls{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.toolbar{margin:14px 0}.spacer{flex:1}
.gallery-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.gallery-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;margin-top:15px}
.photo-card{border:1px solid var(--line);background:#181a1e;border-radius:13px;overflow:hidden;text-align:left;padding:0;min-width:0}
.photo-card img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block}.photo-card span{display:block;padding:8px 9px;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#dce0e8}
.drop-note{border:1px dashed #515966;border-radius:14px;padding:22px;text-align:center;color:var(--muted);margin-top:14px}
.stage-wrap{display:flex;justify-content:center;min-height:100px}.stage{position:relative;display:inline-block;max-width:100%;max-height:58vh;line-height:0;user-select:none}.stage>img{display:block;max-width:100%;max-height:58vh;width:auto;height:auto;border-radius:7px}
.dim{position:absolute;inset:0;background:rgba(12,14,18,.8);pointer-events:none}.bright-cells{position:absolute;inset:0;pointer-events:none}.bright-cell{position:absolute;overflow:hidden;outline:2px solid var(--accent);outline-offset:-2px}
.bright-cell img{position:absolute;max-width:none;max-height:none;border-radius:0}
.lines{position:absolute;inset:0;pointer-events:none}.v,.h{position:absolute;background:rgba(235,240,248,.34);box-shadow:0 0 1px rgba(0,0,0,.25);touch-action:none;pointer-events:auto}
.v{top:0;bottom:0;width:1px;transform:translateX(-.5px)}.h{left:0;right:0;height:1px;transform:translateY(-.5px)}
.v:after{content:"";position:absolute;left:-13px;right:-13px;top:0;bottom:0}.h:after{content:"";position:absolute;top:-13px;bottom:-13px;left:0;right:0}
.cell-buttons{display:grid;grid-template-columns:repeat(var(--cols),1fr);position:absolute;inset:0}.cell-buttons button{border:0;border-radius:0;background:transparent;padding:0;min-width:0;min-height:0}
.field{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}.field input{width:55px;background:#111317;border:1px solid var(--line);border-radius:8px;color:white;padding:8px;text-align:center}
.progress{height:7px;background:#454951;border-radius:9px;overflow:hidden;flex:1;min-width:70px}.progress div{height:100%;background:var(--accent);width:0}
.dim-choice[aria-pressed=true]{border-color:var(--accent);color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
footer{color:var(--muted);text-align:center;padding:20px;font-size:12px}
@media(max-width:600px){header{padding-top:calc(14px + env(safe-area-inset-top))}main{padding:8px 12px 30px}.stage,.stage>img{max-height:52vh}.panel{padding:11px}.gallery-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style></head><body>
<header><div><div class="brand">Gridx</div><div class="note">FOCUSED DRAWING PRACTICE</div></div><div class="note">一マスに集中し、全体を見失わない。</div></header>
<main>
<section id="galleryScreen">
  <div class="toolbar">
    <label class="primary">写真を追加<input id="fileInput" type="file" accept="image/*" multiple hidden></label>
    <label class="primary">フォルダーを読み込む<input id="folderInput" type="file" accept="image/*" webkitdirectory directory multiple hidden></label>
    <button id="randomBtn">ランダムに開く</button>
    <span class="spacer"></span><span id="photoCount" class="note">0枚</span>
  </div>
  <section class="panel">
    <div class="gallery-head"><b>ギャラリー</b><span class="note">写真を選ぶとグリッド画面に進みます</span></div>
    <div id="galleryGrid" class="gallery-grid"></div>
    <div id="emptyGallery" class="drop-note">写真またはフォルダーを読み込んでください<br><span class="note">複数の画像をまとめて追加できます</span></div>
  </section>
</section>

<section id="gridScreen" class="hidden">
  <div class="toolbar"><button id="backBtn">← ギャラリーに戻る</button><span id="currentName" class="note"></span><span class="spacer"></span><button id="nextPhotoBtn">次の写真 →</button></div>
  <section class="panel">
    <div class="stage-wrap"><div id="stage" class="stage">
      <img id="photo" alt="模写する写真"><div id="dim" class="dim"></div><div id="brightCells" class="bright-cells"></div><div id="cellButtons" class="cell-buttons"></div><div id="lines" class="lines"></div>
    </div></div>
    <div class="controls" style="margin-top:14px"><b id="selectionCount">1マス選択中</b><span class="note">マスをタップして選択・解除</span><span class="spacer"></span><button id="selectOne">選択を1マスに戻す</button></div>
  </section>
  <section class="panel">
    <div class="controls"><b>格子設定</b><label class="field">横（列）<input id="cols" type="number" min="1" max="12" value="4"></label><label class="field">縦（行）<input id="rows" type="number" min="1" max="12" value="4"></label><button id="applyGrid">均等に再配置</button></div>
    <div class="controls" style="margin-top:12px"><button data-preset="3">3×3</button><button data-preset="4">4×4</button><button data-preset="5">5×5</button><button data-preset="6">6×6</button><button data-preset="8">8×8</button><span class="spacer"></span><span class="note">周囲の明るさ</span><button class="dim-choice" data-dim="10">10%</button><button class="dim-choice" data-dim="20" aria-pressed="true">20%</button><button class="dim-choice" data-dim="30">30%</button></div>
    <p class="note">グリッドの線はドラッグして動かせます。選択したマスはすべて明るく表示されます。</p>
  </section>
  <section class="panel">
    <div class="controls"><button id="markDone" class="primary">✓ 選択したマスを完了</button><span id="progressText" class="note">0 / 16 完了</span><div class="progress"><div id="progressBar"></div></div><button id="clearDone">進捗をリセット</button></div>
  </section>
</section>
</main>
<footer>写真は外部サーバーへ送信されません。ページを閉じると再読み込みが必要です。</footer>
<script src="./app.js" defer></script></body></html>
